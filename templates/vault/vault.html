{% extends 'base.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2>My Vault</h2>

    <a href="{% url 'add_password' %}" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i>
        Add Password
    </a>

</div>

<div class="mb-4">

    <input
        type="text"
        class="form-control"
        placeholder="🔍 Search passwords...">

</div>

<div class="row">

{% for item in passwords %}

<div class="col-lg-6 mb-4">

<div class="card password-card">

<div class="card-body">

<div class="d-flex justify-content-between">

<h5 class="fw-bold text-light">
    <i class="bi bi-globe2 text-info"></i>
    {{ item.website }}
</h5>

{% if item.favorite %}

<i class="bi bi-star-fill text-warning"></i>

{% else %}

<i class="bi bi-star text-light"></i>

{% endif %}

</div>

<p class="text-secondary">

{{ item.username }}

</p>

<h5>

<span
id="pwd{{ item.id }}"
class="text-light fw-semibold">

••••••••••••

</span>

</h5>

<hr>

<div class="d-flex gap-2">

<button
class="btn btn-outline-primary copy-btn"
onclick="togglePassword({{ item.id }},this)">

<i class="bi bi-eye"></i>

</button>

<button
class="btn btn-outline-success copy-btn"
onclick="copyPassword({{ item.id }},this)">

<i class="bi bi-clipboard"></i>

</button>

<a
class="btn btn-outline-warning"
href="{% url 'edit_password' item.id %}">

<i class="bi bi-pencil"></i>

</a>

<a
class="btn btn-outline-danger"
href="{% url 'delete_password' item.id %}"
onclick="return confirm('Delete password?')">

<i class="bi bi-trash"></i>

</a>

</div>

</div>

</div>

</div>

{% endfor %}

</div>

{% endblock %}
